<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MitoFilm — Sənin filmlərin</title>
<link rel="stylesheet" href="/styles.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  .result-wrap { max-width: 900px; margin: 0 auto; padding: 64px 24px 80px; }
  .result-head { text-align: center; margin-bottom: 40px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 20px;
    border: 3px solid var(--line-strong);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .movie-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; }
  .movie-card:hover { transform: translateY(-3px); border-color: var(--line-strong); }
  .movie-poster-wrap { position: relative; }
  .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
  .day-badge {
    position: absolute; top: 10px; left: 10px;
    background: rgba(23, 13, 20, 0.85);
    border: 1px solid var(--line-strong);
    color: var(--gold);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 999px;
  }
  .movie-card .card-title { padding: 12px 14px 14px; font-size: 14.5px; font-weight: 700; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10, 5, 8, 0.82);
    z-index: 50; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--surface); border-radius: 20px 20px 0 0; max-width: 560px; width: 100%;
    max-height: 88vh; overflow-y: auto; padding: 0 0 28px;
    animation: slideUp 0.25s ease;
  }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; }
    .modal-sheet { border-radius: 20px; max-height: 80vh; }
  }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-sheet img { width: 100%; max-height: 320px; object-fit: cover; display: block; }
  .modal-body { padding: 20px 24px 4px; }
  .modal-close {
    position: sticky; top: 12px; float: right; margin: 0 12px 0 0;
    background: rgba(23,13,20,0.75); border: 1px solid var(--line-strong); color: var(--ivory);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;
  }
  .modal-day-badge { display:inline-block; background: var(--rose); color: var(--ivory); font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; }
  .modal-body h3 { margin: 0 0 8px; font-size: 20px; }
  .modal-meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .modal-body p { margin: 0 0 12px; font-size: 14px; color: var(--muted); line-height: 1.55; }
  .modal-review { color: var(--ivory); border-left: 2px solid var(--gold); padding-left: 12px; margin: 0 0 16px; font-size: 14px; }
  .modal-links a { display: inline-block; color: var(--gold); text-decoration: none; font-weight: 700; font-size: 14px; margin: 0 14px 8px 0; }
  .modal-links a:hover { text-decoration: underline; }
  .back-link { display: block; text-align: center; margin-top: 40px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--gold); }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="brand">Mito<span>Film</span></a>
</nav>

<div class="result-wrap">
  <div id="content">
    <div class="result-head">
      <div class="spinner"></div>
      <h2>Ödəniş təsdiqlənir...</h2>
      <p style="color:var(--muted)">Bir neçə saniyə gözlə, filmlərin hazırlanır 🎬</p>
    </div>
  </div>
  <a href="/" class="back-link">← Ana səhifəyə qayıt</a>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script src="/result.js"></script>
</body>
</html>
